name: Build 3D Land Mod Hub

'on':
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

            - name: Show build diagnostics
        run: |
          echo "=== Makefile ==="
          cat Makefile
          echo "=== DEVKITARM ==="
          echo "$DEVKITARM"
          echo "=== devkitPro rules ==="
          find /opt/devkitpro -name 3ds_rules 2>
dev/null || true
          echo "=== Compiler ==="
          which arm-none-eabi-gcc || true
          echo "=== Build ==="
          make V=1