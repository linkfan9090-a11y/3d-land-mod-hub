
name: Build 3D Land Mod Hub

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build homebrew
        run: make
      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: 3DLandModHub
          path: 3DLandModHub.3dsx
